<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Map Camera App</title>
    
    <!-- FIX: Content Security Policy (मैप और API को इंटरनेट एक्सेस करने की अनुमति देने के लिए) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: 'unsafe-inline' 'unsafe-eval' https://*; img-src 'self' data: blob: 'unsafe-inline' https://*; connect-src 'self' https://*;">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Piexifjs for EXIF injection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.min.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>GPS Stamp App</h1>
    </div>

    <div class="container">
        <div class="card">
            <label>1. Upload Photo (JPEG only)</label>
            <input type="file" id="photoUpload" accept="image/jpeg, image/jpg">
        </div>

        <div class="card">
            <label>2. Pin Location on Map</label>
            <div id="map"></div>
            <div class="coord-display" id="coordDisplay">Lat: 25.212421, Lng: 77.041336</div>
        </div>

        <div class="card">
            <label>3. Stamp Text Details (Auto-fills from Map)</label>
            <input type="text" id="shortAddress" placeholder="Title (e.g. Niwari, Rajasthan, India 🇮🇳)">
            <input type="text" id="fullAddress" placeholder="Subtitle (e.g. Niwari, Rajasthan 325217...)">
            <input type="text" id="altitude" placeholder="Bottom Text / Altitude (e.g. 160)" value="160">
        </div>

        <div class="card">
            <label>4. Date & Time</label>
            <input type="datetime-local" id="datetimePicker">
        </div>

        <button id="downloadBtn" disabled>Process & Save Photo</button>
        
        <a href="gps-camera-app.apk" download class="apk-btn">Download Android APK</a>
    </div>

    <!-- Cordova JS (वेबसाइट पर एरर नहीं देगा, लेकिन APK में फाइल सेव करने के लिए ज़रूरी है) -->
    <script src="cordova.js"></script>
    
    <!-- Main App Logic -->
    <script src="app.js"></script>
    
    <!-- Service Worker Registration for Offline Web App -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered successfully.'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
