name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Cordova APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Copy Files (Inject Network Permissions)
        run: |
          cordova create build-wrapper com.gps.camera GPSCamera
          rm -rf build-wrapper/www/*
          rsync -av --exclude='build-wrapper' --exclude='.git' --exclude='.github' ./ build-wrapper/www/
          
          # Allows the map to load inside the compiled APK
          sed -i 's/<\/widget>/    <allow-navigation href="*" \/>\n    <allow-intent href="*" \/>\n<\/widget>/g' build-wrapper/config.xml

      - name: Build APK (Inject File Plugin)
        working-directory: ./build-wrapper
        run: |
          cordova plugin add cordova-plugin-file
          cordova platform add android
          cordova build android

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: gps-camera-app.apk
          path: build-wrapper/platforms/android/app/build/outputs/apk/debug/app-debug.apk
